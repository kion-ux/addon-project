<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>影渡り KAGEWATARI</title>
<meta name="theme-color" content="#0f1420">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
  /* 一枚の世界に徹した暗い配色（テーマ切り替えはしない）。HUD 各部の色はこのトークンから取る。 */
  :root {
    color-scheme: dark;
    --ink: #0f1420;        /* 夜の藍 */
    --ink-2: #1a2233;
    --plaster: #f1e9da;    /* 漆喰の白 */
    --plaster-dim: #b9b0a0;
    --terracotta: #c4623f; /* 屋根瓦 */
    --copper: #c98a4b;     /* 主人公の金具 */
    --sea: #2d7f99;
    --danger: #e0443a;
    --warn: #f0b542;
    --ok: #7fc28a;
    --panel: rgba(15, 20, 32, 0.72);
    --panel-line: rgba(241, 233, 218, 0.18);
    --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --font-ui: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
  }
  html, body { height: 100%; margin: 0; background: var(--ink); color: var(--plaster); overflow: hidden; }
  body {
    font-family: var(--font-ui);
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    overscroll-behavior: none;
  }
  #app { position: fixed; inset: 0; overflow: hidden; background: var(--ink); }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* モジュールが中身を差し込む層。下から HUD → タッチ操作 → メニュー */
  .layer { position: absolute; inset: 0; pointer-events: none; }
  .layer > * { pointer-events: auto; }
  #hud-layer { z-index: 10; }
  #touch-layer { z-index: 20; }
  #menu-layer { z-index: 30; }
  #boot {
    position: absolute; inset: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: radial-gradient(120% 90% at 50% 110%, #2a3446 0%, var(--ink) 60%);
    padding: max(16px, var(--safe-t)) max(16px, var(--safe-r)) max(16px, var(--safe-b)) max(16px, var(--safe-l));
    text-align: center;
  }
  #boot h1 {
    margin: 0; font-family: var(--font-display); font-weight: 800;
    font-size: clamp(40px, 9vmin, 84px); letter-spacing: 0.18em; line-height: 1;
  }
  #boot .en { font-size: 12px; letter-spacing: 0.5em; color: var(--copper); margin-top: -6px; }
  #boot-msg { font-size: 14px; color: var(--plaster-dim); min-height: 1.4em; }
  #boot .bar { width: min(260px, 60vw); height: 3px; background: rgba(241,233,218,.12); overflow: hidden; border-radius: 2px; }
  #boot-bar { height: 100%; background: var(--copper); transform-origin: 0 50%; transform: scaleX(0); transition: transform .2s; }
  #boot .boot-error {
    max-width: min(92vw, 720px); max-height: 40vh; overflow: auto; text-align: left;
    font-size: 11px; line-height: 1.5; color: #ffb4ab; background: rgba(0,0,0,.4); padding: 10px; border-radius: 6px;
    white-space: pre-wrap; -webkit-user-select: text; user-select: text;
  }
  #boot.is-error #boot-msg { color: #ffb4ab; }
  noscript { position: absolute; inset: 0; display: grid; place-items: center; }
  @media (prefers-reduced-motion: reduce) { #boot-bar { transition: none; } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app">
  <canvas id="view" aria-label="ゲーム画面"></canvas>
  <div id="hud-layer" class="layer"></div>
  <div id="touch-layer" class="layer"></div>
  <div id="menu-layer" class="layer"></div>
  <div id="boot">
    <h1>影渡り</h1>
    <div class="en">KAGEWATARI</div>
    <div class="bar"><div id="boot-bar"></div></div>
    <div id="boot-msg">読み込み中…</div>
  </div>
  <noscript>このゲームを遊ぶには JavaScript を有効にしてください。</noscript>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
